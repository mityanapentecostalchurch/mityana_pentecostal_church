{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">

            <h3>

                Edit Member

            </h3>

        </div>

        <div class="card-body">

            <form
                method="post"
                enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-success">

                    Save Changes

                </button>

                <a
                    href="{% url 'admin-member-details' member.id %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
