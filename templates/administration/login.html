{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h3>Administrator Login</h3>

        </div>

        <div class="card-body">

            {% if error %}

                <div class="alert alert-danger">

                    {{ error }}

                </div>

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label>Username</label>

                    <input
                        type="username"
                        name="username"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <button
                    class="btn btn-dark w-100">

                    Login

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
