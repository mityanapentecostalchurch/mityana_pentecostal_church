{% extends 'base.html' %}

{% block content %}

<h2>Member Login</h2>

<form method="post">

    {% csrf_token %}

    <p>
        Email
        <input type="email"
               name="email">
    </p>

    <p>
        Password
        <input type="password"
               name="password">
    </p>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
