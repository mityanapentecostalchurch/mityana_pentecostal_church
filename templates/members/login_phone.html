{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">

                    <h4>
                        📱 Mobile OTP Login
                    </h4>

                    <small>
                        Mityana Pentecostal Church
                    </small>

                </div>

                <div class="card-body p-4">

                    <h5 class="text-center mb-3">
                        Sign in with your phone
                    </h5>

                    <p class="text-center text-muted">
                        Enter the mobile number registered
                        with Mityana Pentecostal Church.
                    </p>

                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}

                    <form
                        method="POST"
                        action="{% url 'send-phone-otp' %}"
                    >

                        {% csrf_token %}

                        <div class="mb-3">

                            <label
                                for="phone_number"
                                class="form-label"
                            >
                                Mobile Number
                            </label>

                            <input
                                type="text"
                                name="phone_number"
                                id="phone_number"
                                class="form-control"
                                placeholder="0700123456"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            📲 Send OTP
                        </button>

                    </form>

                    <hr>

                    <div class="text-center">

                        <a
                            href="{% url 'member-login' %}"
                            class="btn btn-outline-primary"
                        >
                            ← Back to Member Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
