{% extends 'base.html' %}

{% load static %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Update My Profile</h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="text-center mb-4">

                    {% if user.profile_photo %}
                        <img
                            src="{{ user.profile_photo.url }}"
                            class="rounded-circle border"
                            width="160"
                            height="160"
                            style="object-fit:cover;">
                    {% else %}
                        <img
                            src="{% static 'images/default_user.png' %}"
                            class="rounded-circle border"
                            width="160"
                            height="160"
                            style="object-fit:cover;">
                    {% endif %}

                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Profile Photo
                    </label>

                    <input
                        type="file"
                        name="profile_photo"
                        class="form-control"
                        accept="image/*">
                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            First Name
                        </label>

                        <input
                            type="text"
                            name="first_name"
                            value="{{ user.first_name }}"
                            class="form-control">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Last Name
                        </label>

                        <input
                            type="text"
                            name="last_name"
                            value="{{ user.last_name }}"
                            class="form-control">

                    </div>

                </div>

                <hr>

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-success">

                    Save Changes

                </button>

                <a
                    href="/members/dashboard/"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
