{% extends 'base.html' %}

{% block content %}

<a href="/counselling/queue/"
   class="btn btn-dark">

    ← Back to Queue

</a>

<hr>

<h2>
    {{ counselling.subject }}
</h2>

<p>

    <strong>Member:</strong>

    {{ counselling.member }}

</p>

<p>

    <strong>Status:</strong>

    {{ counselling.status }}

</p>

<p>

    <strong>Request:</strong>

</p>

<div class="card">

    <div class="card-body">

        {{ counselling.details }}

    </div>

</div>

<br>

<a href="/counselling/{{ counselling.id }}/schedule/"
   class="btn btn-success">

    Schedule Session

</a>

{% endblock %}
