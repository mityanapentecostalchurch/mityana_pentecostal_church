{% extends 'base.html' %}

{% block content %}

<h2>Staff Login</h2>

{% if error %}
<p style="color:red;">
    {{ error }}
</p>
{% endif %}

<form method="post">

    {% csrf_token %}

    <p>
        Username:
        <input type="text"
               name="username">
    </p>

    <p>
        Password:
        <input type="password"
               name="password">
    </p>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
