{% extends 'base.html' %}

{% block content %}

<div class="mb-3">

    <a href="/staff/"
       class="btn btn-dark">

        ← Back to Staff Dashboard

    </a>

</div>

<h2>Prayer Queue</h2>

<table class="table table-striped">

    <thead>

        <tr>

            <th>Title</th>

            <th>Status</th>

            <th>Assigned To</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody>

        {% for prayer in prayers %}

        <tr>

            <td>
                {{ prayer.title }}
            </td>

            <td>
                {{ prayer.status }}
            </td>

            <td>
                {{ prayer.assigned_to }}
            </td>

            <td>

                <a href="/staff/prayers/{{ prayer.id }}/"
                   class="btn btn-primary btn-sm">

                    Open

                </a>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="4">

                No assigned prayer requests.

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
