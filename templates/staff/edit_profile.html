{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<h2>

Edit Profile

</h2>

<form

method="post"

enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">

<label>

First Name

</label>

<input

type="text"

name="first_name"

class="form-control"

value="{{ user.first_name }}">

</div>

<div class="mb-3">

<label>

Last Name

</label>

<input

type="text"

name="last_name"

class="form-control"

value="{{ user.last_name }}">

</div>

<div class="mb-3">

<label>

Email

</label>

<input

type="email"

name="email"

class="form-control"

value="{{ user.email }}">

</div>


<div class="mb-3">

<label>

Phone

</label>

<input
type="text"
name="phone_number"
class="form-control"
value="{{ user.phone_number }}">

</div>

<div class="mb-3">

<label>

Position

</label>

<input
type="text"
name="position"
class="form-control"
value="{{ user.position }}">

</div>

<div class="mb-3">

<label>

Office

</label>

<input
type="text"
name="office"
class="form-control"
value="{{ user.office }}">

</div>

<div class="mb-3">

<label>

Department

</label>

<input
type="text"
name="department"
class="form-control"
value="{{ user.department }}">

</div>

<div class="mb-3">

<label>

Biography

</label>

<textarea
name="biography"
class="form-control"
rows="6">{{ user.biography }}</textarea>

</div>

<div class="mb-3">

<label>

Profile Photo

</label>

<input
type="file"
name="profile_photo"
class="form-control">

</div>



<button

class="btn btn-success">

Save Changes

</button>

<a

href="/staff/profile/"

class="btn btn-secondary">

Cancel

</a>

</form>

</div>

{% endblock %}
