{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<h2>

Edit Profile

</h2>

<form

method="post"

enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">

<label>

First Name

</label>

<input

type="text"

name="first_name"

class="form-control"

value="{{ user.first_name }}">

</div>

<div class="mb-3">

<label>

Last Name

</label>

<input

type="text"

name="last_name"

class="form-control"

value="{{ user.last_name }}">

</div>

<div class="mb-3">

<label>

Email

</label>

<input

type="email"

name="email"

class="form-control"

value="{{ user.email }}">

</div>

<div class="mb-3">

<label>

Profile Photo

</label>

<input

type="file"

name="profile_photo"

class="form-control">

</div>

<button

class="btn btn-success">

Save Changes

</button>

<a

href="/staff/profile/"

class="btn btn-secondary">

Cancel

</a>

</form>

</div>

{% endblock %}
