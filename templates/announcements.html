{% extends 'base.html' %}

{% block content %}

<h1>Church Announcements</h1>

{% for announcement in announcements %}

<div class="card mb-3">

    <div class="card-body">

        <h4>{{ announcement.title }}</h4>

        <p>
            {{ announcement.content }}
        </p>

        <small>
            {{ announcement.created_at }}
        </small>

    </div>

</div>

{% empty %}

<p>No announcements available.</p>

{% endfor %}

{% endblock %}
